<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counter</title>
    <link rel="stylesheet" href="/ui.css" />
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; display: flex; justify-content: center; }
      main { width: min(40rem, 100% - 2rem); padding: 2rem 0; }
      h1 { margin: 0 0 0.25rem; }
      .hint { opacity: 0.7; margin: 0 0 1.5rem; }
      label { display: grid; gap: 0.25rem; font-size: 0.9rem; }
      input { font: inherit; padding: 0.5rem; border: 1px solid #8884; border-radius: 0.4rem; }
      .value { font-size: 4rem; font-weight: 600; margin: 1rem 0; font-variant-numeric: tabular-nums; }
      .actions { display: flex; gap: 0.5rem; }
      button { font: inherit; padding: 0.5rem 1rem; border: 1px solid #8884; border-radius: 0.4rem; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: wait; }
      h2 { margin-top: 2rem; font-size: 1rem; opacity: 0.7; }
      .history { padding-left: 1.5rem; font-size: 0.9rem; }
      .history li { margin: 0.25rem 0; }
      code { font-size: 0.85em; }
    </style>
  </head>
  <body class="ui-theme-auto">
    <script type="module" src="/counter.js"></script>
  </body>
</html>
