name: Chat checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chat.yml"
      - "apps/chat/**"
      - "apps/site/**"
      - "lib/**"
      - "package.json"
      - "bun.lock"
      - "bin/**"
      - "spago.yaml"
      - "spago.lock"
      - "tsconfig*.json"
  pull_request:
    paths:
      - ".github/workflows/chat.yml"
      - "apps/chat/**"
      - "apps/site/**"
      - "lib/**"
      - "package.json"
      - "bun.lock"
      - "bin/**"
      - "spago.yaml"
      - "spago.lock"
      - "tsconfig*.json"

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: purescript-contrib/setup-purescript@27b4d58195c470f821f4b7071c5af4e2e483b2c5
        with:
          purescript: 0.15.16
          spago: 1.0.4
      - id: cache-alexandrite
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/purescript-alexandrite
          key: ${{ runner.os }}-alexandrite-741827da180fe9bad542096bb6592d5db4e65d04
      - if: steps.cache-alexandrite.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/purefunctor/purescript-alexandrite.git --rev 741827da180fe9bad542096bb6592d5db4e65d04 --locked purescript-alexandrite --bin purescript-alexandrite
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run ci:chat
