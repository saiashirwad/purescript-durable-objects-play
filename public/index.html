<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f4f7;
        --bg-glow: radial-gradient(60rem 30rem at 50% -10%, #dfe6ff 0%, transparent 60%);
        --surface: rgba(255, 255, 255, 0.72);
        --surface-solid: #ffffff;
        --text: #15171c;
        --muted: #737784;
        --line: rgba(20, 22, 30, 0.08);
        --accent: #3b6cf0;
        --accent-2: #6a5cff;
        --accent-ink: #ffffff;
        --bubble: #ffffff;
        --bubble-shadow: 0 1px 2px rgba(20, 22, 30, 0.06), 0 8px 24px -16px rgba(20, 22, 30, 0.25);
        --danger: #d43f3f;
        --ring: rgba(59, 108, 240, 0.35);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 15px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f13;
          --bg-glow: radial-gradient(60rem 30rem at 50% -10%, #1b2245 0%, transparent 60%);
          --surface: rgba(20, 21, 27, 0.72);
          --surface-solid: #16171d;
          --text: #eceef3;
          --muted: #8d919e;
          --line: rgba(255, 255, 255, 0.08);
          --accent: #6b8cff;
          --accent-2: #9b7bff;
          --accent-ink: #ffffff;
          --bubble: #1d1f27;
          --bubble-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -16px rgba(0, 0, 0, 0.6);
          --danger: #ff6b6b;
          --ring: rgba(107, 140, 255, 0.45);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg-glow), var(--bg); background-attachment: fixed;
        color: var(--text); display: flex; justify-content: center;
      }
      main { width: 100%; height: 100dvh; display: flex; flex-direction: column; }
      h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; }
      .hint { color: var(--muted); }
      code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

      input, button { font: inherit; color: inherit; background: transparent; border: 0; border-radius: 999px; }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      button { cursor: pointer; white-space: nowrap; transition: background 120ms ease, color 120ms ease, transform 120ms ease, opacity 120ms ease; }
      button:disabled { opacity: 0.45; cursor: default; }
      button:not(:disabled):active { transform: scale(0.97); }
      button.primary {
        padding: 0.7rem 1.2rem; font-weight: 600; color: var(--accent-ink);
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 8px 20px -10px var(--accent);
      }
      button.quiet { padding: 0.45rem 0.8rem; color: var(--muted); font-weight: 500; }
      button.quiet:hover:not(:disabled) { color: var(--text); background: var(--line); }
      button.chip {
        display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.35rem 0.7rem;
        font-size: 0.8rem; font-weight: 500; color: var(--muted); border: 1px solid var(--line);
      }
      button.chip:hover { color: var(--text); background: var(--line); }
      button.chip svg { width: 0.85rem; height: 0.85rem; }
      svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      /* Lobby and name screens */
      .centered { justify-content: center; align-items: center; padding: 1.5rem; }
      .card {
        width: min(24rem, 100%); background: var(--surface-solid); border: 1px solid var(--line);
        border-radius: 1.5rem; padding: 2.25rem 2rem; display: grid; gap: 1rem; text-align: center;
        box-shadow: var(--bubble-shadow);
      }
      .card h1 { font-size: 1.5rem; letter-spacing: -0.02em; }
      .card input {
        padding: 0.75rem 1rem; text-align: center; background: var(--line);
      }

      /* Room */
      .room header {
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        padding: 0.8rem clamp(1rem, 3vw, 2.5rem); position: sticky; top: 0; z-index: 1;
        background: var(--surface); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
        border-bottom: 1px solid var(--line);
      }
      .room-title { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
      .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--muted); opacity: 0.5; transition: background 200ms ease, box-shadow 200ms ease; }
      .dot.online { background: #2ecc71; opacity: 1; box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2); }
      .members { display: flex; align-items: center; margin-right: 0.5rem; }
      .members .avatar { width: 1.5rem; height: 1.5rem; font-size: 0.6rem; margin-left: -0.4rem; box-shadow: 0 0 0 2px var(--surface-solid); }
      .members .avatar:first-child { margin-left: 0; }
      .room-id { font-size: 0.75rem; color: var(--muted); }
      .online-count { font-size: 0.8rem; }
      .typing {
        display: flex; align-items: center; gap: 0.5rem; height: 0; overflow: hidden; opacity: 0;
        padding: 0 1.1rem; font-size: 0.8rem; color: var(--muted);
        transition: height 160ms ease, opacity 160ms ease, margin 160ms ease;
      }
      .typing.visible { height: 1.4rem; opacity: 1; margin-bottom: 0.35rem; }
      .dots { display: inline-flex; gap: 0.2rem; }
      .dots i { width: 0.35rem; height: 0.35rem; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
      .dots i:nth-child(2) { animation-delay: 0.2s; }
      .dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
      .room-actions { display: flex; align-items: center; gap: 0.25rem; }
      .identity { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.75rem 0.25rem 0.25rem; font-weight: 500; }
      .identity:hover { background: var(--line); }
      .avatar {
        flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center;
        font-size: 0.7rem; font-weight: 700; color: #fff;
        background: linear-gradient(145deg, hsl(var(--hue) 70% 58%), hsl(calc(var(--hue) + 40) 70% 48%));
      }

      .messages {
        list-style: none; margin: 0; padding: 1.25rem clamp(1rem, 3vw, 2.5rem); flex: 1; min-height: 0; overflow-y: auto;
        display: flex; flex-direction: column; gap: 0.75rem; overscroll-behavior: contain; scroll-behavior: smooth;
      }
      .messages li { display: flex; align-items: flex-end; gap: 0.6rem; max-width: min(78%, 44rem); animation: rise 180ms ease-out; }
      .messages li.mine { align-self: flex-end; flex-direction: row-reverse; }
      .avatar.bot { background: linear-gradient(145deg, #f7b733, #fc4a1a); }
      .bot .bubble { border: 1px solid transparent; background: linear-gradient(var(--bubble), var(--bubble)) padding-box, linear-gradient(135deg, #f7b733, #fc4a1a) border-box; }
      .messages li.continued { margin-top: -0.45rem; }
      .gutter { flex: none; width: 1.75rem; }
      .mine .gutter { display: none; }
      .bubble {
        position: relative; padding: 0.55rem 0.85rem 0.5rem; border-radius: 1.15rem;
        background: var(--bubble); box-shadow: var(--bubble-shadow);
        display: flex; flex-direction: column; gap: 0.1rem;
      }
      .theirs .bubble { border-bottom-left-radius: 0.4rem; }
      .theirs.continued .bubble { border-top-left-radius: 0.4rem; }
      .mine .bubble {
        color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-bottom-right-radius: 0.4rem;
      }
      .mine.continued .bubble { border-top-right-radius: 0.4rem; }
      .author { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
      .bubble p { white-space: pre-wrap; overflow-wrap: anywhere; }
      .time { align-self: flex-end; font-size: 0.65rem; opacity: 0.6; margin-top: 0.1rem; }
      .messages li.empty {
        align-self: center; margin: auto; max-width: none; flex-direction: column; align-items: center; gap: 0.25rem;
        animation: none; text-align: center;
      }
      .empty-title { font-weight: 600; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

      /* Message content */
      .stack { display: flex; flex-direction: column; min-width: 0; position: relative; }
      .bubble p + p, .bubble blockquote, .bubble ul, .bubble pre, .bubble h2, .bubble h3, .bubble h4 { margin-top: 0.35rem; }
      .bubble h2, .bubble h3, .bubble h4 { margin: 0.3rem 0 0.1rem; font-size: 1rem; }
      .bubble ul { margin: 0.2rem 0 0 1.1rem; padding: 0; list-style: disc; }
      .bubble blockquote { margin: 0.3rem 0; padding-left: 0.6rem; border-left: 2px solid currentColor; opacity: 0.8; }
      .bubble pre { margin: 0.35rem 0; padding: 0.5rem 0.65rem; border-radius: 0.5rem; background: rgba(0, 0, 0, 0.08); overflow-x: auto; font-size: 0.8rem; }
      .bubble code { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 0.85em; }
      .bubble p code { padding: 0.05rem 0.3rem; border-radius: 0.3rem; background: rgba(0, 0, 0, 0.08); }
      .mine .bubble pre, .mine .bubble p code { background: rgba(255, 255, 255, 0.18); }
      .bubble a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
      .mention { font-weight: 600; color: var(--accent); }
      .mine .mention { color: inherit; }
      .mention.me { background: rgba(247, 183, 51, 0.25); border-radius: 0.3rem; padding: 0 0.2rem; }
      .messages li.mentioned .bubble { box-shadow: 0 0 0 2px rgba(247, 183, 51, 0.6), var(--bubble-shadow); }
      .image { display: block; margin-top: 0.4rem; }
      .image img { max-width: min(100%, 24rem); max-height: 20rem; border-radius: 0.6rem; display: block; }
      .quote {
        display: grid; text-align: left; gap: 0.05rem; margin: 0 0 0.35rem; padding: 0.3rem 0.6rem; border-radius: 0.5rem;
        border-left: 3px solid var(--accent); background: rgba(0, 0, 0, 0.06); font-size: 0.8rem; cursor: pointer;
      }
      .mine .quote { background: rgba(255, 255, 255, 0.18); border-left-color: rgba(255, 255, 255, 0.7); }
      .quote-author { font-weight: 600; }
      .quote-text { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mine .quote-text { color: inherit; opacity: 0.85; }
      .messages li.flash .bubble { animation: flash 1.2s ease; }
      @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--ring); } 100% { box-shadow: var(--bubble-shadow); } }

      /* Reactions and hover bar */
      .reactions { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
      .mine .reactions { justify-content: flex-end; }
      .reaction {
        display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.1rem 0.5rem; font-size: 0.8rem;
        background: var(--surface-solid); border: 1px solid var(--line); border-radius: 999px;
      }
      .reaction.mine { border-color: var(--accent); background: rgba(59, 108, 240, 0.12); }
      .reaction .count { color: var(--muted); font-size: 0.7rem; }
      .hover-bar {
        position: absolute; top: -0.9rem; right: 0.5rem; display: none; gap: 0.1rem; padding: 0.1rem;
        background: var(--surface-solid); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--bubble-shadow);
      }
      .mine .hover-bar { right: auto; left: 0.5rem; }
      .hover-bar button { padding: 0.15rem 0.4rem; font-size: 0.9rem; }
      .hover-bar svg { width: 0.9rem; height: 0.9rem; }
      .messages li:hover .hover-bar { display: inline-flex; }

      /* Composer extras */
      .reply-chip, .attachments, .suggest { display: flex; align-items: center; gap: 0.5rem; margin: 0 0.5rem 0.5rem; font-size: 0.85rem; }
      .reply-chip { color: var(--muted); padding: 0.3rem 0.6rem; border-left: 3px solid var(--accent); background: var(--line); border-radius: 0.4rem; }
      .reply-chip svg { width: 0.9rem; height: 0.9rem; flex: none; }
      .reply-chip span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .attachment { position: relative; display: inline-flex; }
      .attachment img { height: 3.5rem; border-radius: 0.5rem; border: 1px solid var(--line); }
      .attachment button { position: absolute; top: -0.5rem; right: -0.5rem; width: 1.3rem; height: 1.3rem; padding: 0; background: var(--surface-solid); border: 1px solid var(--line); }
      .attachment.uploading { padding: 1rem; color: var(--muted); }
      .suggest { flex-wrap: wrap; }
      .suggest button { display: inline-flex; align-items: center; gap: 0.35rem; border: 1px solid var(--line); background: var(--surface-solid); }
      .suggest .avatar { width: 1.3rem; height: 1.3rem; font-size: 0.6rem; }
      .attach { color: var(--muted); }
      .attach svg { width: 1.2rem; height: 1.2rem; }
      .composer { padding-left: 0.5rem; }

      footer {
        padding: 0.75rem clamp(1rem, 3vw, 2.5rem) calc(1rem + env(safe-area-inset-bottom));
        background: var(--surface); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
        border-top: 1px solid var(--line);
      }
      .composer {
        display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.35rem 0.35rem 1.6rem;
        background: var(--surface-solid); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--bubble-shadow);
        transition: box-shadow 120ms ease, border-color 120ms ease;
      }
      .composer:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring), var(--bubble-shadow); }
      .composer input { flex: 1; min-width: 0; padding: 0.55rem 0.15rem; caret-color: var(--accent); }
      .composer input::placeholder { color: var(--muted); }
      .composer input:focus-visible { outline: none; }
      .send {
        flex: none; width: 2.4rem; height: 2.4rem; display: grid; place-items: center; color: var(--accent-ink);
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
      .send svg { width: 1.1rem; height: 1.1rem; stroke-width: 2.5; }
      .error { color: var(--danger); font-size: 0.85rem; margin: 0.5rem 0 0 1.1rem; }
      .centered .card { margin: auto; }

      @media (max-width: 40rem) {
        .room-id, .online-count, .identity span { display: none; }
        .identity { padding-right: 0.25rem; }
        .messages li { max-width: 88%; }
      }
    </style>
  </head>
  <body>
    <script type="module" src="/chat.js"></script>
  </body>
</html>
