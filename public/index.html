<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; --line: #8884; }
      body { margin: 0; display: flex; justify-content: center; }
      main { width: min(44rem, 100% - 2rem); min-height: 100dvh; display: flex; flex-direction: column; }
      h1 { margin: 0; font-size: 1.25rem; }
      .hint, .time { opacity: 0.6; }
      .centered { justify-content: center; gap: 1rem; text-align: center; align-items: center; }
      .centered form { display: flex; gap: 0.5rem; }
      .centered input { min-width: 16rem; }
      header { display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: end; padding: 1rem 0; border-bottom: 1px solid var(--line); }
      label { display: grid; gap: 0.25rem; font-size: 0.8rem; opacity: 0.8; }
      input, button { font: inherit; padding: 0.5rem 0.75rem; border: 1px solid var(--line); border-radius: 0.5rem; background: transparent; color: inherit; }
      button { cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: wait; }
      button.quiet { border: none; opacity: 0.6; }
      .messages { list-style: none; margin: 0; padding: 1rem 0; flex: 1; overflow-y: auto; display: flex; flex-direction: column-reverse; gap: 0.75rem; }
      .messages li { max-width: 80%; padding: 0.5rem 0.75rem; border-radius: 0.75rem; background: #8882; }
      .messages li.mine { align-self: flex-end; background: #4a8cff33; }
      .messages li p { margin: 0.25rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .author { font-weight: 600; font-size: 0.85rem; margin-right: 0.5rem; }
      .time { font-size: 0.75rem; }
      .room form { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; padding: 1rem 0; border-top: 1px solid var(--line); }
      header .hint { margin: 0.25rem 0 0; font-size: 0.85rem; }
      header .hint button { padding: 0; font-size: inherit; }
      .error { color: #d33; margin: 0 0 1rem; }
    </style>
  </head>
  <body>
    <script type="module" src="/chat.js"></script>
  </body>
</html>
